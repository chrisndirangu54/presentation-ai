name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/presentation_ai
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      OPENAI_API_KEY: ci-openai
      TOGETHER_AI_API_KEY: ci-together
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
